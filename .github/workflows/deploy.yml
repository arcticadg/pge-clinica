name: Deploy para VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Enviar para VPS via SSH
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configura chave SSH
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # 3. Envia arquivos via rsync
      #    Arquivos sensíveis ficam intocados na VPS
      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.user.ini' \
            --exclude='.htaccess' \
            --exclude='credentials.php' \
            --exclude='config.json' \
            --exclude='rate_limit.json' \
            --exclude='uploads/' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/

      # 3b. Envia .htaccess separadamente (sem --delete para não conflitar)
      - name: Atualizar .htaccess
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            .htaccess ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PATH }}/.htaccess

      # 4. Ajusta permissões na VPS
      - name: Corrigir permissões
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "find ${{ secrets.VPS_PATH }} -type f -exec chmod 644 {} \; && \
             find ${{ secrets.VPS_PATH }} -type d -exec chmod 755 {} \; && \
             chown www:nogroup ${{ secrets.VPS_PATH }}/config.json 2>/dev/null || true && \
             chown www:nogroup ${{ secrets.VPS_PATH }}/credentials.php 2>/dev/null || true && \
             chown www:nogroup ${{ secrets.VPS_PATH }}/rate_limit.json 2>/dev/null || true && \
             chown -R www:nogroup ${{ secrets.VPS_PATH }}/uploads 2>/dev/null || true && \
             echo 'Deploy concluido em '\$(date)"
