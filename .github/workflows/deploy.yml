name: Deploy para VPS

on:
  push:
    branches:
      - main   # dispara a cada push na branch main

jobs:
  deploy:
    name: Enviar para VPS via SSH
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Envia os arquivos para a VPS via rsync (SSH)
      #    Arquivos sensíveis são excluídos — eles já estão na VPS
      - name: Deploy via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >
            -avz
            --delete
            --exclude='.git/'
            --exclude='credentials.php'
            --exclude='config.json'
            --exclude='rate_limit.json'
            --exclude='uploads/'
          path: ./
          remote_path: ${{ secrets.VPS_PATH }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key:  ${{ secrets.VPS_SSH_KEY }}

      # 3. (Opcional) Ajusta permissões após o envio
      - name: Corrigir permissões
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            chmod 644 ${{ secrets.VPS_PATH }}/*.php
            chmod 644 ${{ secrets.VPS_PATH }}/*.html
            chmod 644 ${{ secrets.VPS_PATH }}/*.css
            chmod 755 ${{ secrets.VPS_PATH }}
            echo "Deploy concluído em $(date)"
